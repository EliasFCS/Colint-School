  <rect x="0" y="0" width="800" height="200" rx="12" ry="12" fill="url(#LinearGradient)" stroke="#FFD700" 
        stroke-width="12"/>

   <text x="200" y="100" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
