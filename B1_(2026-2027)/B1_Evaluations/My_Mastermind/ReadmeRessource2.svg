<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200%">
  <defs>
   <linearGradient id="linearGradient" x1="0%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%" stop-color="#FF3B30" />
    <stop offset="35%" stop-color="#289244" />
    <stop offset="55%" stop-color="#157083" />
    <stop offset="65%" stop-color="#014dc2ff" />
    <stop offset="100%" stop-color="#FA6C14" />
  </linearGradient>

    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,240,0.749)" />
      <stop offset="100%" stop-color="#4e4c50" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="200" rx="12" ry="12" fill="url(#linearGradient)" stroke="url(#strokeGradient)" 
        stroke-width="12"/>

   <text x="200" y="100" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="50" 
        font-weight="bold" 
        fill="#ffffff"
        stroke="#120D16"
        stroke-width="0.5" 
        dominant-baseline="middle"
        alignment-baseline="central">
    My Mastermind
  </text>
</svg>