<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200%">
  <defs>
    <linearGradient id="LinearGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="10%" stop-color="#120D16" /> 
      <stop offset="50%" stop-color="#00FFFF" />     
      <stop offset="90%" stop-color="#120D16" />   
    </linearGradient>

    <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,240,0.749)" />
      <stop offset="100%" stop-color="#4e4c50" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="200" rx="12" ry="12" fill="url(#LinearGradient)" stroke="url(#strokeGradient)" 
        stroke-width="12"/>

   <text x="400" y="100" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="50" 
        font-weight="bold" 
        fill="#FFFFF0"
        stroke="#120D16"
        stroke-width="1.5"
        text-anchor="middle"
        alignment-baseline="central">
    My Printf
  </text>
</svg>
