<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200%">
  <defs>
    <clipPath id="myrect">
      <rect x="0" y="0" width="800" height="200" rx="12" ry="12" fill="url(#LinearGradient)" />
    </clipPath>
  </defs>

  <image x="0" y="0" width="800" height="200" 
         href="Image1.jpg" 
         clip-path="url(#myrect)" 
         preserveAspectRatio="xMidYMid slice" />

   <text x="200" y="100" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" 
        font-size="50" 
        font-weight="bold" 
        fill="#ffffff"
        dominant-baseline="middle"
        alignment-baseline="central">
    My Christmas Tree
  </text>
</svg>