[package]
name = "Test5"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_core_pipeline", 
    "bevy_render",        
    "bevy_sprite",
    "bevy_sprite_render",        
    "x11", 
    "wayland",
] }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"     
lto = true          
codegen-units = 1
strip = true