[package]
name = "Test5"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "2d",
    "ui",
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_core_pipeline", 
    "bevy_render",        
    "bevy_sprite",
    "bevy_sprite_render",   
    "dynamic_linking",     
    "x11", 
    "wayland",
] }

log = { version = "0.4", features = ["max_level_debug", "release_max_level_off"] }


[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"     
lto = true          
codegen-units = 1
strip = true