<html style="background-color: black">
    <div
        id="my_bouncing_box"
        style="background-color: blue; border-radius: 3px; position: absolute; left: 0px; top: 0px; min-width: 100px; min-height: 100px; text-align: center; font-weight: bold; color: #999;"
    >
        fares_e
    </div>
    <script type="text/javascript">
    const box  = document.getElementById('my_bouncing_box');

    let posX = parseFloat(box.style.left) || 0; 
    let posY = parseFloat(box.style.top) || 0;

    let speedX = 20;
    let speedY = 10;

    
    function animation(){ 
        const BoxWidth = box.offsetWidth;
        const BoxHeight =  box.offsetHeight;
        const WindowWidth = window.innerWidth;
        const WindowHeight = window.innerHeight;

        posX += speedX;
        posY += speedY;

        if (posX + BoxWidth >= WindowWidth || posX <= 0) {
            speedX = -speedX
        }
        if (posY + BoxHeight >= WindowHeight || posY <= 0) {
            speedY = -speedY
        }

        box.style.left = posX + "px";
        box.style.top = posY + "px";
    }

    setInterval(animation, 30);
    </script>
</html>
